[project]
name = "iam-service"
version = "0.1.0"
description = "Product-neutral identity and access service"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "alembic>=1.13",
    "argon2-cffi>=23.1",
    "cryptography>=43",
    "fastapi>=0.115",
    "httpx>=0.28",
    "pydantic-settings>=2.4",
    "pyjwt>=2.10",
    "sqlalchemy[asyncio]>=2.0.35",
    "psycopg[binary]>=3.2",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.20",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[project.scripts]
# Reference CLI локального harness: `iam auth login|status|logout|session`.
iam = "iam_client.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iam_service", "src/iam_client"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: требует запущенный reference deployment из deploy/keycloak",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
# Комментарии и docstrings в этом репозитории пишутся по-русски, поэтому
# проверки на «похожие» символы кириллицы отключены.
ignore = ["B008", "RUF001", "RUF002", "RUF003"]
